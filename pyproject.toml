[project]
name = "emergencia"
version = "0.1.0"
description = "Inferencia de reglas mínimas de agentes a partir de patrones colectivos observados"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
